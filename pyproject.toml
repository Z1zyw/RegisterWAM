[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "register-wam"
version = "0.1.0"
description = "Clean RegisterWAM reference implementation on Wan2.2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.35",
  "termcolor>=2",
  "rich>=13",
  "accelerate>=1.0",
  "av>=12",
  "datasets>=3.0",
  "deepspeed>=0.14",
  "einops>=0.8",
  "huggingface-hub>=0.29",
  "hydra-core>=1.3",
  "imageio>=2.34",
  "numpy>=1.26",
  "omegaconf>=2.3",
  "pillow>=10",
  "safetensors>=0.5",
  "torch>=2.4",
  "torchvision>=0.19",
  "tqdm>=4.66",
  "transformers>=4.49",
  "wandb>=0.18",
]

[project.optional-dependencies]
eval = ["mujoco==3.3.2", "robosuite==1.4.0", "bddl", "easydict", "gym==0.25.2"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["register_wam*"]

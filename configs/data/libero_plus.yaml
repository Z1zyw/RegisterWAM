train:
  _target_: register_wam.datasets.lerobot.robot_video_dataset_fast_raw_optimized.RobotVideoDatasetFastRawOptimized
  dataset_dirs:
    - ${oc.env:REGISTER_WAM_ASSET_ROOT,.}/data/libero_mujoco3.3.2/libero_spatial_no_noops_lerobot
    - ${oc.env:REGISTER_WAM_ASSET_ROOT,.}/data/libero_mujoco3.3.2/libero_object_no_noops_lerobot
    - ${oc.env:REGISTER_WAM_ASSET_ROOT,.}/data/libero_mujoco3.3.2/libero_goal_no_noops_lerobot
    - ${oc.env:REGISTER_WAM_ASSET_ROOT,.}/data/libero_mujoco3.3.2/libero_10_no_noops_lerobot
  shape_meta:
    images:
      - key: image
        raw_shape: [3, 512, 512]
        shape: [3, 512, 512]
      - key: wrist_image
        raw_shape: [3, 512, 512]
        shape: [3, 512, 512]
    action:
      - key: default
        raw_shape: 7
        shape: 7
    state:
      - key: default
        raw_shape: 8
        shape: 8
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 4
  video_size: [224, 448]
  camera_key: null
  val_set_proportion: 0.0
  is_training_set: true
  skip_padding_as_possible: false
  concat_multi_camera: "horizontal"
  video_augmentation:
    enabled: false
  text_context_cache_size: 4096
  log_retry_traceback: false
  processor:
    _target_: register_wam.datasets.lerobot.processors.register_wam_processor_fast.RegisterWAMProcessorFast
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_image_steps: 9
    num_output_cameras: 2
    action_output_dim: 7
    proprio_output_dim: 8
    delta_action_dim_mask:
      default: [true, true, true, true, true, true, false]
    action_state_transforms: null
    use_stepwise_action_norm: False
    norm_default_mode: min/max
    norm_exception_mode: null
    action_state_merger:
      _target_: register_wam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms: []
    val_transforms: []
  text_embedding_cache_dir: ${oc.env:REGISTER_WAM_ASSET_ROOT,.}/data/text_embeds_cache/libero
  context_len: 128

val:
  _target_: register_wam.datasets.lerobot.robot_video_dataset_fast_raw_optimized.RobotVideoDatasetFastRawOptimized
  dataset_dirs: ${data.train.dataset_dirs}
  shape_meta: ${data.train.shape_meta}
  num_frames: ${data.train.num_frames}
  global_sample_stride: ${data.train.global_sample_stride}
  action_video_freq_ratio: ${data.train.action_video_freq_ratio}
  video_size: ${data.train.video_size}
  camera_key: ${data.train.camera_key}
  val_set_proportion: ${data.train.val_set_proportion}
  is_training_set: false
  skip_padding_as_possible: ${data.train.skip_padding_as_possible}
  concat_multi_camera: ${data.train.concat_multi_camera}
  video_augmentation:
    enabled: false
  text_context_cache_size: ${data.train.text_context_cache_size}
  log_retry_traceback: ${data.train.log_retry_traceback}
  processor:
    _target_: register_wam.datasets.lerobot.processors.register_wam_processor_fast.RegisterWAMProcessorFast
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_image_steps: ${data.train.processor.num_image_steps}
    num_output_cameras: 2
    action_output_dim: 7
    proprio_output_dim: 8
    delta_action_dim_mask:
      default: [true, true, true, true, true, true, false]
    action_state_transforms: null
    use_stepwise_action_norm: False
    norm_default_mode: min/max
    norm_exception_mode: null
    action_state_merger:
      _target_: register_wam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms: []
    val_transforms: []
  text_embedding_cache_dir: ${data.train.text_embedding_cache_dir}
  context_len: ${data.train.context_len}
